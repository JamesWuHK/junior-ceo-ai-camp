  <g transform="translate(270 846)" filter="url(#softShadow)">
    <path d="M 0 0 C 300 -20, 660 -14, 1232 0 L 1218 72 C 800 92, 402 86, 12 72 Z" fill="#fff0a8" stroke="#263545" stroke-width="4" />
