<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="9" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08" />
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#263545" flood-opacity="0.16" />
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d8ccb4" stroke-width="1" opacity="0.22" />
    </pattern>
    <style>
      .paper { fill: #fbf5e5; }
      .grid { fill: url(#grid); opacity: 0.85; }
      .ink { fill: #172033; }
      .muted { fill: #536151; }
      .orange { fill: #f05a28; }
      .green { fill: #1f6f50; }
      .blue { fill: #5db6d7; }
      .yellow { fill: #ffd86a; }
      .card { fill: #fffaf0; stroke: #263545; stroke-width: 4; }
      .photo { fill: #edf4f4; stroke: #263545; stroke-width: 4; }
      .redline { fill: none; stroke: #e7412b; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .sketch { fill: none; stroke: #263545; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #263545; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .soft { fill: none; stroke: #8a7a5c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.56; }
      .title { font: 900 78px "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .subtitle { font: 800 32px "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .label { font: 900 28px "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .small { font: 800 22px "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .tiny { font: 800 18px "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="paper" width="1672" height="941" />
  <rect class="grid" width="1672" height="941" />

  <path d="M 88 120 C 230 92, 366 92, 520 111 S 830 105, 1018 88 S 1340 76, 1572 112" fill="none" stroke="#f4a261" stroke-width="13" stroke-linecap="round" opacity="0.42" />
  <text x="92" y="104" class="title orange">找茬儿：</text>
  <text x="405" y="104" class="title ink">AI 画错了哪里？</text>
  <path d="M 93 140 C 300 165, 575 152, 782 151 S 1210 170, 1548 142" class="redline" opacity="0.85" />
  <text x="104" y="190" class="subtitle muted">先圈出来，再告诉 AI：哪里不对，想改成什么。</text>

  <g transform="translate(78 236)">
    <path d="M 0 0 L 120 22 L 106 122 L -6 106 Z" fill="#fff1a6" stroke="#263545" stroke-width="4" filter="url(#softShadow)" />
