      .line { fill: none; stroke: #172018; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #172018; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .skin { fill: #f4c9a6; stroke: #172018; stroke-width: 6; }
