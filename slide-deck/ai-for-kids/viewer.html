<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI通识5讲 · 幻灯片预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080d14;color:#fff;font-family:"Inter","SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
.slide-container{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
.slide{display:none;max-width:95vw;max-height:90vh;position:relative}
.slide.active{display:block}
.slide img{max-width:100%;max-height:90vh;border-radius:12px;box-shadow:0 4px 40px rgba(0,0,0,.5)}
.slide .label{position:absolute;top:-32px;left:0;font-size:13px;color:rgba(255,255,255,.4);letter-spacing:1px}
.nav{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:rgba(15,20,30,.9);padding:10px 24px;border-radius:40px;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);z-index:100}
.nav button{background:none;border:none;color:rgba(255,255,255,.6);font-size:20px;cursor:pointer;padding:6px 12px;border-radius:8px;transition:all .2s}
.nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav .page{font-size:13px;color:rgba(255,255,255,.35);min-width:60px;text-align:center}
.nav .page span{color:#60c8a0}
.thumbnail-strip{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);display:flex;gap:6px;overflow-x:auto;max-width:90vw;padding:8px;background:rgba(0,0,0,.4);border-radius:12px;z-index:99}
.thumbnail-strip img{height:50px;border-radius:4px;opacity:.4;cursor:pointer;transition:all .2s;border:2px solid transparent}
.thumbnail-strip img:hover{opacity:.8}
.thumbnail-strip img.active{border-color:#60c8a0;opacity:1}
.arrow-hint{position:absolute;bottom:50%;left:50%;transform:translate(-50%,50%);font-size:14px;color:rgba(255,255,255,.15);pointer-events:none}
.toc{position:fixed;top:20px;right:20px;background:rgba(15,20,30,.95);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;z-index:100;backdrop-filter:blur(12px);max-height:60vh;overflow-y:auto;display:none}
.toc.show{display:block}
.toc h3{font-size:12px;color:rgba(255,255,255,.3);margin-bottom:10px;letter-spacing:1px}
.toc a{display:block;font-size:12px;color:rgba(255,255,255,.5);text-decoration:none;padding:4px 0;transition:color .2s}
.toc a:hover{color:#60c8a0}
.toc a.current{color:#60c8a0;font-weight:700}
.toc-toggle{position:fixed;top:20px;right:20px;background:rgba(15,20,30,.9);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:12px;padding:6px 14px;border-radius:8px;cursor:pointer;z-index:101;transition:all .2s}
.toc-toggle:hover{color:#fff;border-color:rgba(255,255,255,.2)}
</style>
</head>
<body>

<div class="slide-container" id="container"></div>

<div class="nav">
  <button onclick="prev()">←</button>
  <div class="page"><span id="curr">1</span> / 17</div>
  <button onclick="next()">→</button>
</div>

<div class="thumbnail-strip" id="thumbs"></div>

<div class="toc" id="toc">
  <h3>AI 通识 5 讲</h3>
  <a href="#1">01 · 封面</a>
  <a href="#2">主题1 · 你分得清谁是AI吗？</a>
  <a href="#3">02 · 图灵的游戏</a>
  <a href="#4">主题2 · AI不只会聊天</a>
  <a href="#5">03 · AI的感官时间线</a>
  <a href="#6">04 · AI能看能听能画</a>
  <a href="#7">主题3 · AI能自己干活了</a>
  <a href="#8">05 · 普通AI vs 智能体</a>
  <a href="#9">06 · 帮AI策划生日派对</a>
  <a href="#10">主题4 · 中国的DeepSeek</a>
  <a href="#11">07 · 100块做了1000块的事</a>
  <a href="#12">08 · DeepSeek三大优势</a>
  <a href="#13">主题5 · 两个团队在比赛</a>
  <a href="#14">09 · Team USA vs Team China</a>
  <a href="#15">10 · 比赛才刚开始</a>
  <a href="#16">11 · 5个知识点回顾</a>
  <a href="#17">封底 · AI时代 你是CEO</a>
</div>
<button class="toc-toggle" onclick="toggleToc()">📋 目录</button>

<script>
const TOTAL = 17;
const EXT = '.png';

let current = 0;
let slides = [];
let thumbs = [];

function init() {
  const container = document.getElementById('container');
  const thumbStrip = document.getElementById('thumbs');
  
  for (let i = 1; i <= TOTAL; i++) {
    const fn = String(i).padStart(2, '0');
    
    // Slide
    const div = document.createElement('div');
    div.className = 'slide';
    div.innerHTML = `<div class="label">${fn} / ${TOTAL}</div><img src="${fn}${EXT}" alt="Slide ${i}" loading="lazy">`;
    container.appendChild(div);
    slides.push(div);
    
    // Thumbnail
    const thumb = document.createElement('img');
    thumb.src = `${fn}${EXT}`;
    thumb.alt = `#${i}`;
    thumb.onclick = () => goTo(i - 1);
    thumbStrip.appendChild(thumb);
    thumbs.push(thumb);
  }
  
  show(0);
  
  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
    if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    if (e.key === 'End') { e.preventDefault(); goTo(TOTAL - 1); }
    if (e.key === 'Escape') toggleToc();
  });
  
  // TOC click
  document.querySelectorAll('#toc a').forEach(a => {
    a.onclick = e => { e.preventDefault(); goTo(Number(a.hash.slice(1)) - 1); toggleToc(); };
  });
}

function show(i) {
  slides.forEach(s => s.classList.remove('active'));
  slides[i].classList.add('active');
  thumbs.forEach(t => { t.classList.remove('active'); });
  thumbs[i].classList.add('active');
  document.getElementById('curr').textContent = i + 1;
  
  // Scroll thumbnail into view
  thumbs[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  
  // Update TOC highlight
  document.querySelectorAll('#toc a').forEach(a => a.classList.remove('current'));
  const tocLinks = document.querySelectorAll('#toc a');
  if (tocLinks[i]) tocLinks[i].classList.add('current');
  
  current = i;
}

function next() { goTo((current + 1) % TOTAL); }
function prev() { goTo((current - 1 + TOTAL) % TOTAL); }
function goTo(i) { show(i); }

function toggleToc() {
  document.getElementById('toc').classList.toggle('show');
}

init();
</script>
</body>
</html>
