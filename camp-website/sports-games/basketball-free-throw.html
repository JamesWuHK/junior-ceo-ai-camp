<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏀 罚球 1v1 对战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', sans-serif;
    background: #1a1a2e;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #ui {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .scoreboard {
    display: flex;
    gap: 40px;
    margin-top: 16px;
    pointer-events: auto;
  }
  .player-score {
    background: rgba(0,0,0,0.7);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 12px 24px;
    text-align: center;
    min-width: 100px;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  .player-score.active {
    border-color: #ff6b35;
    box-shadow: 0 0 24px rgba(255,107,53,0.4);
    transform: scale(1.05);
  }
  .player-score .name {
    color: #a0a0c0;
    font-size: 0.85rem;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .player-score .score {
    color: #fff;
    font-size: 2.2rem;
    font-weight: 800;
  }
  .turn-indicator {
    margin-top: 10px;
    color: #ff6b35;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(255,107,53,0.6);
  }
  .power-bar-container {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .power-bar-container.visible { display: flex; }
  .power-bar {
    width: 200px;
    height: 12px;
    background: rgba(0,0,0,0.6);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .power-fill {
    height: 100%;
    background: linear-gradient(90deg, #00f5a0, #ff6b35);
    border-radius: 6px;
    transition: width 0.05s linear;
  }
  .power-label {
    color: #a0a0c0;
    font-size: 0.8rem;
    letter-spacing: 1px;
  }
  .game-over-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .game-over-overlay.show { display: flex; }
  .game-over-overlay .winner {
    font-size: 2.5rem;
    font-weight: 800;
    color: #ffd700;
    text-shadow: 0 0 30px rgba(255,215,0,0.5);
  }
  .game-over-overlay .final-score {
    color: #fff;
    font-size: 1.3rem;
    letter-spacing: 2px;
  }
  .btn {
    pointer-events: auto;
    background: linear-gradient(135deg, #ff6b35, #ff4500);
    color: #fff;
    border: none;
    padding: 14px 36px;
    border-radius: 30px;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(255,107,53,0.3);
  }
  .btn:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(255,107,53,0.5); }
  .btn:active { transform: scale(0.97); }
  .btn.secondary {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .hint {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    color: #606080;
    font-size: 0.85rem;
    letter-spacing: 1px;
    z-index: 10;
  }
  .combo-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.5rem;
    font-weight: 800;
    color: #00f5a0;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: all 0.6s;
  }
  .combo-text.show {
    opacity: 1;
    transform: translate(-50%, -80%);
  }
</style>
</head>
<body>

<div id="ui">
  <div class="turn-indicator" id="turnText">🔴 P1 罚球</div>
  <div class="scoreboard">
    <div class="player-score active" id="p1Box">
      <div class="name">🔴 Player 1</div>
      <div class="score" id="p1Score">0</div>
    </div>
    <div class="player-score" id="vsBox" style="border:none;background:transparent;min-width:40px;">
      <div class="name" style="color:#666;">VS</div>
      <div class="score" style="color:#666;font-size:1rem;">FT5</div>
    </div>
    <div class="player-score" id="p2Box">
      <div class="name">🔵 Player 2</div>
      <div class="score" id="p2Score">0</div>
    </div>
  </div>
</div>

<div class="power-bar-container" id="powerBarContainer">
  <div class="power-bar">
    <div class="power-fill" id="powerFill" style="width:0%"></div>
  </div>
  <div class="power-label" id="powerLabel">按住瞄准 · 松手投篮</div>
</div>
<div class="hint" id="hint">按住鼠标瞄准 🖱️ · 松手投篮 🏀</div>

<div class="combo-text" id="comboText"></div>

<div class="game-over-overlay" id="gameOverOverlay">
  <div class="winner" id="winnerText"></div>
  <div class="final-score" id="finalScoreText"></div>
  <div style="display:flex;gap:12px;">
    <button class="btn" onclick="restartGame()">再来一局 🔄</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ── State ────────────────────────────────────
const MAX_ROUND = 5; // each player shoots 5 times
let player1Score = 0;
let player2Score = 0;
let currentPlayer = 1; // 1 or 2
let currentRound = 0;
let isShooting = false;
let isCharging = false;
let chargeStart = 0;
let power = 0;
let gameOver = false;
let swishStreak = 0;
let shotStartTime = 0;

// ── Three.js Setup ───────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1a2e');
scene.fog = new THREE.Fog('#1a1a2e', 15, 60);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 80);
camera.position.set(0, 6, 14);
camera.lookAt(0, 3, -2);

// ── Lighting ─────────────────────────────────
const ambient = new THREE.AmbientLight('#8899bb', 1.8);
scene.add(ambient);

const sun = new THREE.DirectionalLight('#fff5e8', 6);
sun.position.set(15, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.bias = -0.0001;
scene.add(sun);

const rimLight = new THREE.PointLight('#ff6b35', 2, 8);
rimLight.position.set(0, 3.8, -3);
scene.add(rimLight);

const courtLight = new THREE.PointLight('#6688cc', 1, 20);
courtLight.position.set(0, 0.5, 4);
scene.add(courtLight);

// ── Court Floor ──────────────────────────────
const floorGeo = new THREE.PlaneGeometry(26, 30);
const floorMat = new THREE.MeshStandardMaterial({
  color: '#c47a3a',
  roughness: 0.7,
  metalness: 0.05
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, -0.05, 0);
floor.receiveShadow = true;
scene.add(floor);

// Court lines
function addLine(x, y, z, w, d, color) {
  const geo = new THREE.PlaneGeometry(w, d);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, 0.001, z);
  scene.add(mesh);
}

// Free throw line
addLine(0, 0, 3.5, 3.6, 0.08, '#ffffff');
// Three-point arc (simplified as a line)
const arcPoints = [];
for (let i = -40; i <= 40; i++) {
  const angle = (i / 180) * Math.PI;
  arcPoints.push(new THREE.Vector3(Math.sin(angle) * 4.2, 0.002, -2 + Math.cos(angle) * 4.2));
}
const arcGeo = new THREE.BufferGeometry().setFromPoints(arcPoints);
const arcLine = new THREE.Line(arcGeo, new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.5 }));
scene.add(arcLine);

// Lane lines
addLine(-2.5, 0, -1, 0.08, 9, '#ffffff');
addLine(2.5, 0, -1, 0.08, 9, '#ffffff');

// Center circle
const circleGeo = new THREE.TorusGeometry(1.8, 0.04, 8, 64);
const circle = new THREE.Mesh(circleGeo, new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.4 }));
circle.rotation.x = -Math.PI / 2;
circle.position.y = 0.002;
scene.add(circle);

// ── Backboard ────────────────────────────────
const boardGeo = new THREE.BoxGeometry(3.6, 2.4, 0.15);
const boardMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.1, metalness: 0.3 });
const board = new THREE.Mesh(boardGeo, boardMat);
board.position.set(0, 3.8, -4.6);
board.castShadow = true;
board.receiveShadow = true;
scene.add(board);

// Board border
const borderGeo = new THREE.BoxGeometry(3.7, 2.5, 0.08);
const borderMat = new THREE.MeshStandardMaterial({ color: '#1a1a1a', roughness: 0.3 });
const border = new THREE.Mesh(borderGeo, borderMat);
border.position.copy(board.position);
border.position.z += 0.1;
scene.add(border);

// Target square on backboard
const targetGeo = new THREE.PlaneGeometry(1.2, 0.9);
const targetMat = new THREE.MeshBasicMaterial({ color: '#ff3333', side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
const target = new THREE.Mesh(targetGeo, targetMat);
target.position.set(0, 3.8, -4.52);
scene.add(target);

// ── Rim ──────────────────────────────────────
const rimGroup = new THREE.Group();
rimGroup.position.set(0, 3.05, -4.0);

const rimTorus = new THREE.TorusGeometry(0.55, 0.04, 16, 32);
const rimMesh = new THREE.Mesh(rimTorus, new THREE.MeshStandardMaterial({ color: '#ff4500', roughness: 0.3, metalness: 0.8 }));
rimMesh.rotation.x = Math.PI / 2;
rimMesh.castShadow = true;
rimGroup.add(rimMesh);

// Net (simplified as cone-like strips)
const netGroup = new THREE.Group();
const netPts = [];
for (let i = 0; i < 24; i++) {
  const angle = (i / 24) * Math.PI * 2;
  const r = 0.55;
  netPts.push(new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r));
}
for (let level = 1; level <= 4; level++) {
  const y = -level * 0.12;
  const r = 0.55 - level * 0.02;
  const pts = [];
  for (let i = 0; i < 25; i++) {
    const angle = (i / 24) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.4 }));
  netGroup.add(line);
}
// Vertical net strings
for (let i = 0; i < 12; i++) {
  const angle = (i / 12) * Math.PI * 2;
  const r = 0.55;
  const pts = [
    new THREE.Vector3(Math.cos(angle) * r, 0, Math.sin(angle) * r),
    new THREE.Vector3(Math.cos(angle) * (r - 0.08), -0.48, Math.sin(angle) * (r - 0.08))
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.3 }));
  netGroup.add(line);
}
rimGroup.add(netGroup);
scene.add(rimGroup);

// ── Pole ─────────────────────────────────────
const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 5, 16);
const pole = new THREE.Mesh(poleGeo, new THREE.MeshStandardMaterial({ color: '#555', roughness: 0.4, metalness: 0.6 }));
pole.position.set(0, 1.5, -4.6);
pole.castShadow = true;
scene.add(pole);

const poleBaseGeo = new THREE.CylinderGeometry(0.25, 0.3, 0.3, 16);
const poleBase = new THREE.Mesh(poleBaseGeo, new THREE.MeshStandardMaterial({ color: '#333', roughness: 0.3, metalness: 0.8 }));
poleBase.position.set(0, 0.15, -4.6);
scene.add(poleBase);

// ── Basketball ───────────────────────────────
const ballGroup = new THREE.Group();
const ballGeo = new THREE.SphereGeometry(0.24, 32, 32);
const ballMat = new THREE.MeshStandardMaterial({ color: '#e87010', roughness: 0.35, metalness: 0.1 });
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.castShadow = true;
ball.receiveShadow = true;
ballGroup.add(ball);

// Ball lines
const ballLineGeo = new THREE.TorusGeometry(0.24, 0.008, 8, 64);
const ballLine = new THREE.Mesh(ballLineGeo, new THREE.MeshStandardMaterial({ color: '#1a1a1a', roughness: 0.5 }));
ballGroup.add(ballLine);

const ballLine2 = new THREE.Mesh(ballLineGeo, new THREE.MeshStandardMaterial({ color: '#1a1a1a', roughness: 0.5 }));
ballLine2.rotation.x = Math.PI / 2;
ballGroup.add(ballLine2);

const ballLine3 = new THREE.Mesh(ballLineGeo, new THREE.MeshStandardMaterial({ color: '#1a1a1a', roughness: 0.5 }));
ballLine3.rotation.z = Math.PI / 2;
ballGroup.add(ballLine3);

ballGroup.position.set(0, 1.8, 5.5);
scene.add(ballGroup);

// ── Player Character ─────────────────────────
const playerGroup = new THREE.Group();
const skinMat = new THREE.MeshStandardMaterial({ color: '#e8b88a', roughness: 0.6, metalness: 0.05 });
const jerseyMat1 = new THREE.MeshStandardMaterial({ color: '#e84030', roughness: 0.4, metalness: 0.1 });
const jerseyMat2 = new THREE.MeshStandardMaterial({ color: '#2266dd', roughness: 0.4, metalness: 0.1 });
const shortMat1 = new THREE.MeshStandardMaterial({ color: '#cc2222', roughness: 0.5 });
const shortMat2 = new THREE.MeshStandardMaterial({ color: '#1144aa', roughness: 0.5 });
const shoeMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.3, metalness: 0.1 });
const hairMat = new THREE.MeshStandardMaterial({ color: '#2a1a0a', roughness: 0.8 });

// Head
const headGeo = new THREE.SphereGeometry(0.22, 24, 24);
const head = new THREE.Mesh(headGeo, skinMat);
head.position.set(0, 2.35, 0);
head.castShadow = true;
playerGroup.add(head);

// Hair
const hairGeo = new THREE.SphereGeometry(0.23, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2);
const hair = new THREE.Mesh(hairGeo, hairMat);
hair.position.set(0, 2.35, 0);
hair.scale.set(1, 0.4, 1);
playerGroup.add(hair);

// Eyes
const eyeGeo = new THREE.SphereGeometry(0.04, 8, 8);
const eyeMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.1 });
const pupilGeo = new THREE.SphereGeometry(0.025, 8, 8);
const pupilMat = new THREE.MeshStandardMaterial({ color: '#111111', roughness: 0.1 });

function makeEye(x, z) {
  const eyeGroup = new THREE.Group();
  const e = new THREE.Mesh(eyeGeo, eyeMat);
  eyeGroup.add(e);
  const p = new THREE.Mesh(pupilGeo, pupilMat);
  p.position.set(0, 0, 0.03);
  eyeGroup.add(p);
  eyeGroup.position.set(x, 2.42, z);
  return eyeGroup;
}
const leftEye = makeEye(-0.07, -0.19);
const rightEye = makeEye(0.07, -0.19);
playerGroup.add(leftEye);
playerGroup.add(rightEye);

// Neck
const neckGeo = new THREE.CylinderGeometry(0.07, 0.09, 0.12, 12);
const neck = new THREE.Mesh(neckGeo, skinMat);
neck.position.set(0, 2.1, 0);
playerGroup.add(neck);

// Torso
const torsoGeo = new THREE.CylinderGeometry(0.28, 0.22, 0.7, 16);
const torsoTop = new THREE.Mesh(torsoGeo, jerseyMat1);
torsoTop.position.set(0, 1.75, 0);
torsoTop.castShadow = true;
torsoTop.name = 'jersey';
playerGroup.add(torsoTop);

// Jersey number on front
const numGeo = new THREE.PlaneGeometry(0.18, 0.18);
const numCanvas = document.createElement('canvas');
numCanvas.width = 64; numCanvas.height = 64;
const ctx = numCanvas.getContext('2d');
ctx.fillStyle = '#ffffff';
ctx.font = 'bold 44px Arial';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('23', 32, 32);
const numTex = new THREE.CanvasTexture(numCanvas);
numTex.minFilter = THREE.LinearFilter;
const numMat = new THREE.MeshBasicMaterial({ map: numTex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
const jerseyNum = new THREE.Mesh(numGeo, numMat);
jerseyNum.position.set(0, 1.8, 0.281);
playerGroup.add(jerseyNum);

// Upper arms
const armGeo = new THREE.CapsuleGeometry(0.09, 0.32, 8, 12);
const leftUpperArm = new THREE.Mesh(armGeo, skinMat);
leftUpperArm.position.set(-0.33, 1.95, 0);
leftUpperArm.rotation.z = 0.25;
leftUpperArm.castShadow = true;
leftUpperArm.name = 'leftUpperArm';
playerGroup.add(leftUpperArm);

const rightUpperArm = new THREE.Mesh(armGeo, skinMat);
rightUpperArm.position.set(0.33, 1.95, 0);
rightUpperArm.rotation.z = -0.25;
rightUpperArm.castShadow = true;
rightUpperArm.name = 'rightUpperArm';
playerGroup.add(rightUpperArm);

// Forearms
const forearmGeo = new THREE.CapsuleGeometry(0.07, 0.28, 8, 12);
const leftForearm = new THREE.Mesh(forearmGeo, skinMat);
leftForearm.position.set(-0.4, 1.6, 0);
leftForearm.castShadow = true;
leftForearm.name = 'leftForearm';
playerGroup.add(leftForearm);

const rightForearm = new THREE.Mesh(forearmGeo, skinMat);
rightForearm.position.set(0.4, 1.6, 0);
rightForearm.castShadow = true;
rightForearm.name = 'rightForearm';
playerGroup.add(rightForearm);

// Hands
const handGeo = new THREE.SphereGeometry(0.07, 12, 12);
const leftHand = new THREE.Mesh(handGeo, skinMat);
leftHand.position.set(-0.42, 1.42, 0.05);
leftHand.name = 'leftHand';
playerGroup.add(leftHand);

const rightHand = new THREE.Mesh(handGeo, skinMat);
rightHand.position.set(0.42, 1.42, 0.05);
rightHand.name = 'rightHand';
playerGroup.add(rightHand);

// Lower body
const pelvisGeo = new THREE.CylinderGeometry(0.25, 0.2, 0.25, 16);
const pelvis = new THREE.Mesh(pelvisGeo, shortMat1);
pelvis.position.set(0, 1.25, 0);
pelvis.name = 'shorts';
playerGroup.add(pelvis);

// Legs
const thighGeo = new THREE.CapsuleGeometry(0.1, 0.35, 8, 12);
const leftThigh = new THREE.Mesh(thighGeo, skinMat);
leftThigh.position.set(-0.12, 0.95, 0);
leftThigh.castShadow = true;
playerGroup.add(leftThigh);

const rightThigh = new THREE.Mesh(thighGeo, skinMat);
rightThigh.position.set(0.12, 0.95, 0);
rightThigh.castShadow = true;
playerGroup.add(rightThigh);

// Calves
const calfGeo = new THREE.CapsuleGeometry(0.08, 0.32, 8, 12);
const leftCalf = new THREE.Mesh(calfGeo, skinMat);
leftCalf.position.set(-0.12, 0.55, 0);
leftCalf.castShadow = true;
playerGroup.add(leftCalf);

const rightCalf = new THREE.Mesh(calfGeo, skinMat);
rightCalf.position.set(0.12, 0.55, 0);
rightCalf.castShadow = true;
playerGroup.add(rightCalf);

// Shoes
const shoeGeo = new THREE.BoxGeometry(0.14, 0.08, 0.26, 8, 4, 8);
const leftShoe = new THREE.Mesh(shoeGeo, shoeMat);
leftShoe.position.set(-0.12, 0.22, 0.06);
leftShoe.castShadow = true;
playerGroup.add(leftShoe);

const rightShoe = new THREE.Mesh(shoeGeo, shoeMat);
rightShoe.position.set(0.12, 0.22, 0.06);
rightShoe.castShadow = true;
playerGroup.add(rightShoe);

// Shoelace accent
const laceGeo = new THREE.BoxGeometry(0.12, 0.03, 0.06);
const laceMat = new THREE.MeshStandardMaterial({ color: '#ff3333', roughness: 0.3 });
const leftLace = new THREE.Mesh(laceGeo, laceMat);
leftLace.position.set(-0.12, 0.27, 0.02);
playerGroup.add(leftLace);
const rightLace = new THREE.Mesh(laceGeo, laceMat);
rightLace.position.set(0.12, 0.27, 0.02);
playerGroup.add(rightLace);

playerGroup.position.set(0, 0, 4.8);
playerGroup.name = 'player';
scene.add(playerGroup);

// ── Player shadow disc ───────────────────────
const shadowGeo = new THREE.PlaneGeometry(0.8, 0.5);
const shadowMat = new THREE.MeshBasicMaterial({ color: '#000000', transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false });
const playerShadow = new THREE.Mesh(shadowGeo, shadowMat);
playerShadow.rotation.x = -Math.PI / 2;
playerShadow.position.set(0, 0.01, 4.8);
playerShadow.name = 'playerShadow';
scene.add(playerShadow);

// ── Aim Preview Arc ──────────────────────────
const arcPreviewPoints = [];
const arcPreviewGeo = new THREE.BufferGeometry();
const arcPreviewLine = new THREE.Line(arcPreviewGeo, new THREE.LineBasicMaterial({ color: '#00f5a0', transparent: true, opacity: 0.5 }));
arcPreviewLine.visible = false;
scene.add(arcPreviewLine);

// ── Ball Physics ─────────────────────────────
let ballVelocity = new THREE.Vector3();
let ballPos = ballGroup.position.clone();
const GRAVITY = -9.8;
const RIM_Y = 3.05;
const RIM_Z = -4.0;
const RIM_RADIUS = 0.55;  // 更大的篮筐，更容易进球
let ballPassedRimPlane = false;

function resetBall() {
  ballVelocity.set(0, 0, 0);
  ballGroup.position.set(0, 1.8, 5.5);
  ballGroup.rotation.set(0, 0, 0);
  ballGroup.scale.set(1, 1, 1);
  ballMat.color.set('#e87010');
  isShooting = false;
  ballPassedRimPlane = false;
  // Reset player pose
  playerGroup.children.forEach(c => {
    if (c.name === 'rightUpperArm') { c.rotation.set(0, 0, -0.25); }
    if (c.name === 'rightForearm') { c.rotation.set(0, 0, 0); c.position.set(0.4, 1.6, 0); }
    if (c.name === 'rightHand') { c.position.set(0.42, 1.42, 0.05); }
    if (c.name === 'leftUpperArm') { c.rotation.set(0, 0, 0.25); }
    if (c.name === 'leftForearm') { c.rotation.set(0, 0, 0); c.position.set(-0.4, 1.6, 0); }
    if (c.name === 'leftHand') { c.position.set(-0.42, 1.42, 0.05); }
  });
}

function animateShot() {
  // Raise right arm for shooting pose
  playerGroup.children.forEach(c => {
    if (c.name === 'rightUpperArm') c.rotation.set(-1.2, 0, -0.5);
    if (c.name === 'rightForearm') { c.rotation.set(0.3, 0, 0); c.position.set(0.45, 2.15, 0.1); }
    if (c.name === 'rightHand') c.position.set(0.48, 2.25, 0.25);
    if (c.name === 'leftUpperArm') c.rotation.set(-0.6, 0, 0.4);
    if (c.name === 'leftForearm') { c.rotation.set(0, 0, 0); c.position.set(-0.38, 2.05, 0.05); }
    if (c.name === 'leftHand') c.position.set(-0.38, 2.28, 0.15);
  });
  // Ball at shooting hand position (relative to player at z=4.8)
  ballGroup.position.set(0.48, 2.4, 4.55);
}

function updatePlayerColors(pid) {
  const jerseyColor = pid === 1 ? '#e84030' : '#2266dd';
  const shortsColor = pid === 1 ? '#cc2222' : '#1144aa';
  playerGroup.children.forEach(c => {
    if (c.name === 'jersey') c.material = pid === 1 ? jerseyMat1 : jerseyMat2;
    if (c.name === 'shorts') c.material = pid === 1 ? shortMat1 : shortMat2;
  });
  // Update jersey number
  const ctx = numCanvas.getContext('2d');
  ctx.clearRect(0, 0, 64, 64);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 44px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(pid === 1 ? '23' : '6', 32, 32);
  numTex.needsUpdate = true;
}

function shootBall(vx, vy, vz) {
  ballVelocity.set(vx, vy, vz);
  isShooting = true;
  arcPreviewLine.visible = false;
  // Animate shooting pose
  animateShot();
  // Ball launches from hand position (already set by animateShot)
  ballGroup.position.set(0.48, 2.4, 4.55);
}

// ── Check if ball went through hoop ──────────
function checkScore() {
  const p = ballGroup.position;
  // Is ball near rim height?
  if (p.y < RIM_Y + 0.1 && p.y > RIM_Y - 0.6) {
    const distFromCenter = Math.sqrt(p.x * p.x + (p.z - RIM_Z) * (p.z - RIM_Z));
    // Ball going down through the rim
    if (distFromCenter < RIM_RADIUS - 0.1 && ballVelocity.y < 0) {
      // Check if ball was above rim last frame
      return true;
    }
  }
  return false;
}

let scored = false;
let lastBallY = 0;
let lastBallZ = 0;

// ── Input Handling ───────────────────────────
let mouseDown = false;
let mouseStart = { x: 0, y: 0 };
let mouseCurrent = { x: 0, y: 0 };

function getMousePos(e) {
  if (e.touches) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

renderer.domElement.addEventListener('mousedown', (e) => {
  if (isShooting || gameOver) return;
  mouseDown = true;
  isCharging = true;
  chargeStart = performance.now();
  const pos = getMousePos(e);
  mouseStart.x = pos.x;
  mouseStart.y = pos.y;
  mouseCurrent.x = pos.x;
  mouseCurrent.y = pos.y;
  document.getElementById('powerBarContainer').classList.add('visible');
  document.getElementById('hint').style.display = 'none';
});

renderer.domElement.addEventListener('touchstart', (e) => {
  if (isShooting || gameOver) return;
  e.preventDefault();
  mouseDown = true;
  isCharging = true;
  chargeStart = performance.now();
  const pos = getMousePos(e);
  mouseStart.x = pos.x;
  mouseStart.y = pos.y;
  mouseCurrent.x = pos.x;
  mouseCurrent.y = pos.y;
  document.getElementById('powerBarContainer').classList.add('visible');
  document.getElementById('hint').style.display = 'none';
}, { passive: false });

window.addEventListener('mousemove', (e) => {
  if (!mouseDown || !isCharging) return;
  const pos = getMousePos(e);
  mouseCurrent.x = pos.x;
  mouseCurrent.y = pos.y;
  updatePowerAndAim();
});

window.addEventListener('touchmove', (e) => {
  if (!mouseDown || !isCharging) return;
  const pos = getMousePos(e);
  mouseCurrent.x = pos.x;
  mouseCurrent.y = pos.y;
  updatePowerAndAim();
}, { passive: false });

window.addEventListener('mouseup', () => {
  if (!isCharging) return;
  releaseShot();
});

window.addEventListener('touchend', () => {
  if (!isCharging) return;
  releaseShot();
});

function updatePowerAndAim() {
  const elapsed = performance.now() - chargeStart;
  power = Math.min(elapsed / 2000, 1.0); // 2s to full power, easier to control
  
  document.getElementById('powerFill').style.width = (power * 100) + '%';
  
  // Calculate aim direction from mouse drag (reduced sensitivity)
  const dx = mouseCurrent.x - mouseStart.x;
  const dy = mouseCurrent.y - mouseStart.y;
  
  // Show trajectory preview with improved arc
  const aimX = -dx * 0.008;      // gentler horizontal
  const aimAngle = dy * 0.015;    // gentler vertical
  
  const launchSpeed = 5 + power * 6;  // range 5-11, smoother
  
  const pts = [];
  const startPos = ballGroup.position.clone();
  const vx = aimX * launchSpeed;
  const vyBase = launchSpeed * 0.7;  // base upward from power
  const vy = vyBase + aimAngle * launchSpeed;
  const vz = -launchSpeed * 0.5;
  
  for (let t = 0; t < 1.8; t += 0.04) {
    const x = startPos.x + vx * t;
    const y = startPos.y + vy * t + 0.5 * GRAVITY * t * t;
    const z = startPos.z + vz * t;
    if (y < -0.5) break;
    pts.push(new THREE.Vector3(x, y, z));
  }
  arcPreviewGeo.setFromPoints(pts);
  arcPreviewLine.visible = true;
  
  // Rotate ball toward aim
  ballGroup.rotation.x += 0.1;
  ballGroup.rotation.z += 0.05;
}

function releaseShot() {
  mouseDown = false;
  isCharging = false;
  const elapsed = performance.now() - chargeStart;
  power = Math.min(elapsed / 2000, 1.0);
  
  document.getElementById('powerBarContainer').classList.remove('visible');
  
  const dx = mouseCurrent.x - mouseStart.x;
  const dy = mouseCurrent.y - mouseStart.y;
  
  const aimX = -dx * 0.008;
  const aimAngle = dy * 0.015;
  const launchSpeed = 5 + power * 6;
  
  const vx = aimX * launchSpeed;
  const vy = launchSpeed * 0.7 + aimAngle * launchSpeed;
  const vz = -launchSpeed * 0.5;
  
  shootBall(vx, vy, vz);
  scored = false;
  lastBallY = ballGroup.position.y;
  lastBallZ = ballGroup.position.z;
  ballPassedRimPlane = false;
  shotStartTime = performance.now();
}

// ── Camera follow ────────────────────────────
function updateCamera() {
  const bp = ballGroup.position;
  if (isShooting && bp.z < 2) {
    const t = Math.max(0, Math.min(1, (6 - bp.z) / 10));
    camera.position.lerp(
      new THREE.Vector3(bp.x * 0.3, 5, bp.z + 2),
      0.05
    );
    camera.lookAt(bp.x * 0.3, 3.5, -3);
  } else if (!isShooting) {
    camera.position.lerp(new THREE.Vector3(0, 6, 14), 0.03);
    camera.lookAt(0, 3, -2);
  }
}

// ── Game Logic ───────────────────────────────
function handleScore() {
  if (scored) return;
  scored = true;
  swishStreak++;
  
  if (currentPlayer === 1) {
    player1Score++;
    document.getElementById('p1Score').textContent = player1Score;
  } else {
    player2Score++;
    document.getElementById('p2Score').textContent = player2Score;
  }
  
  // Show combo text
  const comboEl = document.getElementById('comboText');
  if (swishStreak >= 2) {
    comboEl.textContent = swishStreak >= 3 ? '🔥 连中 ' + swishStreak + ' 球!' : '👏 空心入网!';
    comboEl.classList.add('show');
    setTimeout(() => comboEl.classList.remove('show'), 1500);
  } else {
    comboEl.textContent = '✅ 进球!';
    comboEl.classList.add('show');
    setTimeout(() => comboEl.classList.remove('show'), 1000);
  }
  
  // Ball visual feedback
  ballMat.color.set('#ffd700');
  setTimeout(() => ballMat.color.set('#e87010'), 500);
}

function nextShot() {
  currentRound++;
  
  // Check if game over
  if (currentRound >= MAX_ROUND * 2) {
    endGame();
    return;
  }
  
  // Switch player
  currentPlayer = currentRound % 2 === 0 ? 1 : 2;
  
  updateTurnUI();
  updatePlayerColors(currentPlayer);
  resetBall();
  document.getElementById('powerLabel').textContent = '按住瞄准 · 松手投篮';
  document.getElementById('hint').style.display = 'block';
}

function updateTurnUI() {
  const p1Box = document.getElementById('p1Box');
  const p2Box = document.getElementById('p2Box');
  const turnText = document.getElementById('turnText');
  
  p1Box.classList.toggle('active', currentPlayer === 1);
  p2Box.classList.toggle('active', currentPlayer === 2);
  
  if (currentPlayer === 1) {
    turnText.textContent = `🔴 P1 罚球 (${Math.floor(currentRound/2)+1}/${MAX_ROUND})`;
    turnText.style.color = '#ff6b35';
  } else {
    turnText.textContent = `🔵 P2 罚球 (${Math.floor(currentRound/2)+1}/${MAX_ROUND})`;
    turnText.style.color = '#4da6ff';
  }
}

function endGame() {
  gameOver = true;
  const overlay = document.getElementById('gameOverOverlay');
  const winnerText = document.getElementById('winnerText');
  const finalScoreText = document.getElementById('finalScoreText');
  
  overlay.classList.add('show');
  finalScoreText.textContent = `P1 ${player1Score} - ${player2Score} P2`;
  
  if (player1Score > player2Score) {
    winnerText.textContent = '🏆 Player 1 获胜!';
    winnerText.style.color = '#ff6b35';
  } else if (player2Score > player1Score) {
    winnerText.textContent = '🏆 Player 2 获胜!';
    winnerText.style.color = '#4da6ff';
  } else {
    winnerText.textContent = '🤝 平局!';
    winnerText.style.color = '#ffd700';
  }
  
  document.getElementById('hint').style.display = 'none';
  document.getElementById('turnText').textContent = '比赛结束';
}

window.restartGame = function() {
  player1Score = 0;
  player2Score = 0;
  currentPlayer = 1;
  currentRound = 0;
  gameOver = false;
  swishStreak = 0;
  scored = false;
  
  document.getElementById('p1Score').textContent = '0';
  document.getElementById('p2Score').textContent = '0';
  document.getElementById('gameOverOverlay').classList.remove('show');
  document.getElementById('hint').style.display = 'block';
  document.getElementById('powerLabel').textContent = '按住瞄准 · 松手投篮';
  
  updateTurnUI();
  updatePlayerColors(1);
  resetBall();
  playerGroup.rotation.y = 0;
};

// ── Animation Loop ───────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  
  // ── Player idle animation ──────────────────
  if (!isShooting) {
    const breathe = Math.sin(now * 0.003) * 0.015;
    playerGroup.children.forEach(c => {
      if (c.name === 'jersey') c.scale.y = 1 + breathe;
    });
    // Subtle sway
    playerGroup.rotation.y = Math.sin(now * 0.001) * 0.04;
    
    if (!isCharging) {
      // Dribble arm motion
      const dribble = Math.abs(Math.sin(now * 0.005));
      playerGroup.children.forEach(c => {
        if (c.name === 'rightForearm') {
          c.position.y = 1.6 + dribble * 0.08;
        }
        if (c.name === 'rightHand') {
          c.position.y = 1.42 + dribble * 0.06;
        }
      });
      // Ball bounces in player's hand
      ballGroup.position.set(0, 1.8 + Math.abs(Math.sin(now * 0.005)) * 0.15, 5.5);
    } else {
      // During charging: bring ball to shooting position, raise arms
      ballGroup.position.set(0, 2.2, 5.2);
      playerGroup.children.forEach(c => {
        if (c.name === 'rightUpperArm') c.rotation.set(-0.6, 0, -0.4);
        if (c.name === 'rightForearm') { c.rotation.set(0.5, 0, 0); c.position.set(0.43, 1.95, 0.08); }
        if (c.name === 'rightHand') c.position.set(0.45, 2.1, 0.2);
      });
    }
    ballGroup.rotation.y += dt * 0.8;
  }
  
  if (isShooting) {
    // Physics update
    ballVelocity.y += GRAVITY * dt;
    ballGroup.position.x += ballVelocity.x * dt;
    ballGroup.position.y += ballVelocity.y * dt;
    ballGroup.position.z += ballVelocity.z * dt;
    
    // Spin the ball
    ballGroup.rotation.x += ballVelocity.z * dt * 3;
    ballGroup.rotation.z -= ballVelocity.x * dt * 3;
    
    const bp = ballGroup.position;
    
    // ── Rim magnetism ──────────────────────────
    // When ball is near rim height and close horizontally, gently pull it in
    if (bp.y > RIM_Y - 0.8 && bp.y < RIM_Y + 0.5 && bp.z < RIM_Z + 0.8 && bp.z > RIM_Z - 0.2) {
      const dx = bp.x;
      const dz = bp.z - RIM_Z;
      const distFromCenter = Math.sqrt(dx * dx + dz * dz);
      if (distFromCenter < RIM_RADIUS + 0.3 && distFromCenter > 0.05) {
        // Gentle pull toward rim center
        const pullStrength = 0.6 * dt;
        ballGroup.position.x -= (dx / distFromCenter) * pullStrength;
        ballGroup.position.z -= (dz / distFromCenter) * pullStrength;
      }
    }
    
    // Track if ball passed through rim plane
    if (bp.z < RIM_Z && lastBallZ >= RIM_Z) {
      ballPassedRimPlane = true;
    }
    
    // ── Score detection (relaxed) ──────────────
    if (!scored && ballPassedRimPlane && bp.y < RIM_Y + 0.15 && bp.y > RIM_Y - 0.7) {
      const distFromCenter = Math.sqrt(bp.x * bp.x + (bp.z - RIM_Z) * (bp.z - RIM_Z));
      // Ball just needs to be mostly within the rim area while crossing the plane
      if (distFromCenter < RIM_RADIUS + 0.08) {
        handleScore();
      }
    }
    
    // Ball hit floor
    if (bp.y < 0.1 && ballVelocity.y < 0) {
      ballGroup.position.y = 0.1;
      ballVelocity.y *= -0.4;
      ballVelocity.x *= 0.5;
      ballVelocity.z *= 0.5;
      
      if (Math.abs(ballVelocity.y) < 0.5) {
        ballVelocity.y = 0;
      }
    }
    
    // Ball out of bounds (behind backboard, etc.)
    if (bp.z < -7 || bp.y < -3 || Math.abs(bp.x) > 12 || bp.z > 8) {
      swishStreak = 0;
      nextShot();
    }
    
    // Ball settled (only after enough time has passed)
    const settled = bp.y < 0.3 && Math.abs(ballVelocity.y) < 0.3 && 
                    Math.abs(ballVelocity.x) < 0.3 && Math.abs(ballVelocity.z) < 0.3;
    const enoughTime = performance.now() - shotStartTime > 1500;
    if (settled && enoughTime && ballPassedRimPlane && bp.z < RIM_Z + 0.3) {
      if (!scored) {
        swishStreak = 0;
        const comboEl = document.getElementById('comboText');
        comboEl.textContent = '❌ 没进';
        comboEl.classList.add('show');
        setTimeout(() => comboEl.classList.remove('show'), 1000);
      }
      nextShot();
    }
    
    lastBallY = bp.y;
    lastBallZ = bp.z;
  } else {
    // Idle ball animation
    ballGroup.position.y = 1.5 + Math.sin(performance.now() * 0.002) * 0.1;
    ballGroup.rotation.y += dt * 0.5;
  }
  
  updateCamera();
  
  // Update rim light color based on active player
  if (currentPlayer === 1) {
    rimLight.color.lerp(new THREE.Color('#ff6b35'), 0.05);
  } else {
    rimLight.color.lerp(new THREE.Color('#4da6ff'), 0.05);
  }
  
  renderer.render(scene, camera);
}

// ── Start ────────────────────────────────────
updateTurnUI();
updatePlayerColors(1);
resetBall();
animate();

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

console.log('🏀 罚球 1v1 对战 已就绪!');
console.log('规则: 每人5次罚球，进球多者获胜');
console.log('操作: 按住鼠标/触摸屏瞄准 → 松手投篮');
