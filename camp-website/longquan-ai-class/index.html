  <script>
    var slides = document.querySelectorAll('.slide');
    var current = 0;
    var total = slides.length;
    var wheelCD = false;
    var touchStartX = 0;
    var touchStartY = 0;
    var chromeTimer = null;
    var expectedHash = '6815f3d0d4d9983add829e38b2caa9b78c0748870dd4ed4456bbc4bdddd33e1d';

    function updateUI() {
      document.getElementById('progress').style.width = ((current + 1) / total * 100) + '%';
      document.getElementById('counter').textContent = (current + 1) + ' / ' + total;
      history.replaceState(null, '', '#slide-' + (current + 1));
    }

    function showSpeakerNotes(index) {
      var notesEl = slides[index].querySelector('script.slide-notes');
      if (!notesEl) return;
      try {
        var notes = JSON.parse(notesEl.textContent);
        console.clear();
        console.group('第 ' + (index + 1) + '/' + total + ' 页：' + notes.title);
        if (notes.script) console.log(notes.script);
        console.groupEnd();
      } catch (_) {}
    }

    function goTo(index) {
      index = Math.max(0, Math.min(total - 1, index));
      var previous = current;
      current = index;
      slides.forEach(function(slide, i) {
        slide.classList.toggle('active', i === current);
      });
      slides[current].scrollIntoView({
        behavior: Math.abs(current - previous) === 1 ? 'smooth' : 'auto',
        block: 'start'
      });
      updateUI();
      showSpeakerNotes(current);
      showChrome();
    }

    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    function hex(buffer) {
      return Array.from(new Uint8Array(buffer)).map(function(byte) {
        return byte.toString(16).padStart(2, '0');
      }).join('');
    }

    async function digest(value) {
      var bytes = new TextEncoder().encode(value);
      return hex(await crypto.subtle.digest('SHA-256', bytes));
    }

    function loadSlides() {
      document.querySelectorAll('.slide-image').forEach(function(frame) {
        frame.style.backgroundImage = 'url("' + frame.dataset.src + '")';
        frame.removeAttribute('data-src');
      });
    }

    function unlock() {
      sessionStorage.setItem('longquan-ai-class-access', 'ok');
      loadSlides();
      document.body.classList.add('unlocked');
      var match = location.hash.match(/^#slide-(\d+)$/);
      goTo(match ? Number(match[1]) - 1 : 0);
      setTimeout(function() {
        if (document.scrollingElement) document.scrollingElement.scrollTop = slides[current].offsetTop;
      }, 50);
    }

    function showChrome() {
      document.body.classList.remove('chrome-hidden');
      clearTimeout(chromeTimer);
      chromeTimer = setTimeout(function() {
        if (document.body.classList.contains('unlocked') && !document.getElementById('help').classList.contains('open')) {
          document.body.classList.add('chrome-hidden');
        }
      }, 2600);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function() {});
      } else {
        document.exitFullscreen().catch(function() {});
      }
    }

    function toggleHelp(force) {
      var help = document.getElementById('help');
      var open = typeof force === 'boolean' ? force : !help.classList.contains('open');
      help.classList.toggle('open', open);
      help.setAttribute('aria-hidden', open ? 'false' : 'true');
      showChrome();
    }

    document.getElementById('gateForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      var input = document.getElementById('passcode');
      var button = document.getElementById('unlockButton');
      var error = document.getElementById('gateError');
      button.disabled = true;
      error.textContent = '';
      try {
        if (await digest(input.value.trim()) === expectedHash) {
          input.value = '';
          unlock();
        } else {
          error.textContent = '口令不正确，请重新输入';
          input.select();
        }
      } catch (_) {
        error.textContent = '当前浏览器无法完成验证，请更换最新版浏览器';
      }
      button.disabled = false;
    });

    document.addEventListener('keydown', function(event) {
      var key = event.key.toLowerCase();
      var blockedSave = (event.ctrlKey || event.metaKey) && ['s', 'u', 'p'].includes(key);
      if (blockedSave) { event.preventDefault(); return; }
      if (!document.body.classList.contains('unlocked')) return;
      if (key === 'escape') { toggleHelp(false); return; }
      if (key === '?' || key === 'h') { event.preventDefault(); toggleHelp(); return; }
      if (key === 'f') { event.preventDefault(); toggleFullscreen(); return; }
      if (event.key === 'ArrowRight' || event.key === 'ArrowDown' || event.key === ' ' || event.key === 'PageDown') { event.preventDefault(); next(); }
      if (event.key === 'ArrowLeft' || event.key === 'ArrowUp' || event.key === 'PageUp') { event.preventDefault(); prev(); }
      if (event.key === 'Home') { event.preventDefault(); goTo(0); }
      if (event.key === 'End') { event.preventDefault(); goTo(total - 1); }
    });

    document.addEventListener('touchstart', function(event) {
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', function(event) {
      if (!document.body.classList.contains('unlocked')) return;
      var diffX = touchStartX - event.changedTouches[0].clientX;
      var diffY = touchStartY - event.changedTouches[0].clientY;
      if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) diffX > 0 ? next() : prev();
    }, { passive: true });

    document.addEventListener('wheel', function(event) {
      if (!document.body.classList.contains('unlocked') || wheelCD) return;
      wheelCD = true;
      setTimeout(function() { wheelCD = false; }, 600);
      if (event.deltaY > 0 || event.deltaX > 0) next(); else prev();
    }, { passive: true });

    document.addEventListener('contextmenu', function(event) { event.preventDefault(); });
    document.addEventListener('dragstart', function(event) { event.preventDefault(); });
    document.addEventListener('selectstart', function(event) {
      if (document.body.classList.contains('unlocked')) event.preventDefault();
    });
    document.addEventListener('mousemove', showChrome, { passive: true });
    document.addEventListener('pointerdown', showChrome, { passive: true });

    document.getElementById('prevZone').addEventListener('click', prev);
    document.getElementById('nextZone').addEventListener('click', next);
    document.getElementById('fullscreenButton').addEventListener('click', toggleFullscreen);
    document.getElementById('helpButton').addEventListener('click', function() { toggleHelp(); });
    document.getElementById('help').addEventListener('click', function(event) {
      if (event.target === this) toggleHelp(false);
    });
    document.addEventListener('dblclick', function(event) {
      if (document.body.classList.contains('unlocked') && !event.target.closest('button')) toggleFullscreen();
    });

    window.addEventListener('scroll', function() {
      if (!document.body.classList.contains('unlocked')) return;
      var scrollTop = Math.max(window.scrollY, document.documentElement.scrollTop, document.body.scrollTop);
      var index = Math.round(scrollTop / Math.max(1, window.innerHeight));
      if (index !== current && index >= 0 && index < total) {
        current = index;
        slides.forEach(function(slide, i) { slide.classList.toggle('active', i === current); });
        updateUI();
      }
    }, { passive: true });

    if (sessionStorage.getItem('longquan-ai-class-access') === 'ok') unlock();
  </script>
</body>
</html>
